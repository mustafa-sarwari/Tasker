<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tasker - A simple and intuitive task management app to organize your daily tasks">
    <meta name="keywords" content="todo, task manager, productivity, to-do list">
    <meta name="author" content="Mustafa Sarwari">
    <title>Tasker - Simple Task Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="div1">
        <h1>To Do List</h1>
        <textarea id="txt" class="txt" placeholder="Enter a task..." aria-label="Task input"></textarea>
        <button class="btn" id="btn" aria-label="Add task">Add</button>
        <ul role="list" aria-label="Task list"></ul>
    </div>
    <script src="to_do_app.js"></script>
</body>
</html>
